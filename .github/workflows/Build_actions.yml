      # *** ADD THIS STEP FOR TESTING ***
      - name: Create Dummy Artifact
        run: |
          export PARENT_DIR="$(pwd)" # Workspace root
          mkdir -p "$PARENT_DIR/files"
          # Create a dummy zip file matching the expected pattern
          DUMMY_ZIP_NAME="${{ matrix.target }}_KSU-Next_$(date +%Y%m%d-%H%M).zip"
          touch "$PARENT_DIR/files/$DUMMY_ZIP_NAME"
          echo "Created dummy file: $PARENT_DIR/files/$DUMMY_ZIP_NAME"
          ls -l "$PARENT_DIR/files"

      - name: Check for Zip File # Keep this to verify dummy file creation
        run: |
           export PARENT_DIR="$(pwd)" # Workspace root
           echo "Checking for zip file in $PARENT_DIR/files..."
           ls -l "$PARENT_DIR/files"

      - name: Create Git Tag
        run: |
          TAG_NAME="build-${{ github.run_number }}-${{ matrix.target }}"
          echo "Creating and pushing tag: $TAG_NAME"
          # Need to be in the git repo directory to run git commands
          cd ./android_kernel_samsung_sm6150_KernelSU-Next
          git tag "$TAG_NAME"
          # Use GITHUB_TOKEN for push authentication
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: /home/runner/work/android_kernel_samsung_sm6150_KernelSU-Next/files/*.zip # Path from workspace root
          name: TEST Release (${{ matrix.target }}) - Run ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}-${{ matrix.target }}
          body: |
            **TEST RELEASE**
          prerelease: true # Mark test releases as pre-releases
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
