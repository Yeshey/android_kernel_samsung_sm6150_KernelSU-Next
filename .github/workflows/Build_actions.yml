name: Build Test

on:
  workflow_dispatch: # Use workflow_dispatch for testing

jobs:
  build_kernel:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: [a70q] # Test with only one target initially

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: android_kernel_samsung_sm6150_KernelSU-Next

      # ... (Keep Set up build environment) ...
      # ... (Keep Fetch ToolChains and Set PATH, but comment out run: block) ...
      # ... (Keep Verify Clang Contents, but comment out run: block) ...
      # ... (Keep Fetch AnyKernel3, but comment out run: block) ...
      # ... (Keep Setup KSU, but comment out run: block) ...
      # ... (Keep Patch with SUSFS, but comment out run: block) ...
      # ... (Keep Build Kernel With KSU, but comment out run: block) ...

      # *** UPDATED DUMMY ARTIFACT STEP FOR TESTING ***
      - name: Create Dummy Artifact
        run: |
          export FILES_DIR="/home/runner/work/android_kernel_samsung_sm6150_KernelSU-Next/files"
          mkdir -p "$FILES_DIR"
          # Create a dummy zip file explicitly starting with 'a70' (using matrix target)
          DUMMY_FILE_NAME="${{ matrix.target }}_dummy_test_$(date +%Y%m%d).zip"
          touch "$FILES_DIR/$DUMMY_FILE_NAME"
          echo "Created dummy file: $FILES_DIR/$DUMMY_FILE_NAME"
          ls -l "$FILES_DIR"

      - name: Check for Zip File # Keep this
        run: |
           export FILES_DIR="/home/runner/work/android_kernel_samsung_sm6150_KernelSU-Next/files"
           echo "Checking for zip file in $FILES_DIR..."
           ls -l "$FILES_DIR"

      - name: Create Git Tag # Keep this step
        run: |
          TAG_NAME="build-${{ github.run_number }}-${{ matrix.target }}"
          echo "Creating and pushing tag: $TAG_NAME"
          # Need to be in the git repo directory to run git commands
          cd ./android_kernel_samsung_sm6150_KernelSU-Next
          git tag "$TAG_NAME"
          # Use GITHUB_TOKEN for push authentication
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub # Use the old working pattern
        uses: softprops/action-gh-release@v2
        with:
          # *** REVERT TO THE a70* PATTERN ***
          files: /home/runner/work/android_kernel_samsung_sm6150_KernelSU-Next/files/a70*
          name: TEST Release (${{ matrix.target }}) - Run ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}-${{ matrix.target }}
          body: |
            **TEST RELEASE**
          prerelease: true # Mark test releases as pre-releases
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
